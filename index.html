<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Despesas de Obras</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
    h1   { text-align: center; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,.1); }
    form { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
    input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
    #total { margin-top: 15px; font-weight: bold; font-size: 1.2em; text-align: right; }
    .filters { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 10px; align-items: center; }
    .btn          { padding: 5px 10px; margin: 2px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-edit     { background: #ffc107; color: black; }
    .btn-delete   { background: #dc3545; color: white; }
    .btn-export   { background: #28a745; color: white; }
    .btn-pdf      { background: #007bff; color: white; }
    .btn-add      { background: #28a745; color: white; font-weight: bold; }
    .btn-migrate  { background: #6f42c1; color: white; font-size: 0.85em; }
    #grafico-container { max-width: 600px; margin: 30px auto; }
    #loading { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35);
               z-index:999; justify-content:center; align-items:center; }
    #loading span { background:#fff; padding:18px 30px; border-radius:8px; font-size:1.1em; }
  </style>
</head>
<body>
<div id="loading"><span>⏳ Aguarde...</span></div>

<div class="container">
  <h1>Controle de Despesas de Obras</h1>

  <form id="form-despesa">
    <input type="date"   id="data"       required>
    <input type="text"   id="item"       placeholder="Item" required>
    <input type="number" id="quantidade" placeholder="Quantidade" min="1" required>
    <input type="number" id="valor"      placeholder="Valor (R$)" step="0.01" required>
    <select id="parte" required>
      <option value="">Parte da Obra</option>
      <option>Fundação</option><option>Estrutura</option><option>Alvenaria</option>
      <option>Acabamento</option><option>Instalações</option><option>Pedreiro</option>
      <option>Arrimo</option><option>Muro</option><option>Outros</option>
    </select>
    <button type="submit" class="btn btn-add" id="btn-adicionar">Adicionar</button>
  </form>

  <div class="filters">
    <div>
      <label>Filtrar por parte:
        <select id="filtro">
          <option value="Todas">Todas</option>
          <option>Fundação</option><option>Estrutura</option><option>Alvenaria</option>
          <option>Acabamento</option><option>Instalações</option><option>Pedreiro</option>
          <option>Arrimo</option><option>Muro</option><option>Outros</option>
        </select>
      </label>
    </div>
    <div>
      <label>De: <input type="date" id="filtroDataInicio"></label>
      <label>Até: <input type="date" id="filtroDataFim"></label>
    </div>
    <button class="btn"            onclick="atualizarTabela()">Aplicar Filtros</button>
    <button class="btn btn-export" onclick="exportarExcel()">Exportar Excel</button>
    <button class="btn btn-pdf"    onclick="exportarPDF()">Exportar PDF</button>
    <button class="btn btn-migrate" onclick="migrarDadosIniciais()" id="btn-migrar"
            title="Importa os 45 registros históricos (execute apenas uma vez)">
      📥 Migrar dados iniciais
    </button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Data</th><th>Item</th><th>Quantidade</th>
        <th>Valor Unitário</th><th>Parte</th><th>Total</th><th>Ações</th>
      </tr>
    </thead>
    <tbody id="lista-despesas"></tbody>
  </table>

  <div id="total">Total Gasto: R$ 0,00</div>

  <div id="grafico-container">
    <canvas id="graficoDespesas"></canvas>
  </div>
</div>

<script>
// ── URL do Apps Script ───────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzq6FnCf2W5n3KFC9u_Wxi8T4ndksHM6qcYACepNNQMntkyawVn_r2_PuW4Eno7tjNV/exec';

// ── dados para migração única ────────────────────────────────
const DADOS_MIGRACAO = [{"data":"2026-05-20","item":"Cimento","quantidade":10,"valor":35.0,"parte":"Arrimo"},{"data":"2026-05-20","item":"Ferragem","quantidade":1,"valor":50.0,"parte":"Arrimo"},{"data":"2026-05-15","item":"Mão de obra","quantidade":4,"valor":200.0,"parte":"Pedreiro"},{"data":"2026-05-15","item":"Arame Cozido","quantidade":2,"valor":20.0,"parte":"Arrimo"},{"data":"2026-05-14","item":"Ferragem (4.2 e arame cozido)","quantidade":16,"valor":12.5,"parte":"Arrimo"},{"data":"2026-05-12","item":"Areia","quantidade":3,"valor":160.0,"parte":"Arrimo"},{"data":"2026-05-12","item":"Brita 1","quantidade":2,"valor":230.0,"parte":"Arrimo"},{"data":"2026-05-12","item":"Lona","quantidade":3,"valor":10.5,"parte":"Outros"},{"data":"2026-03-31","item":"Projeto","quantidade":4,"valor":2250.0,"parte":"Outros"},{"data":"2025-10-15","item":"Cimento + frete (moto)","quantidade":1,"valor":38.0,"parte":"Arrimo"},{"data":"2025-10-15","item":"Mão de obra","quantidade":3,"valor":250.0,"parte":"Pedreiro"},{"data":"2025-10-13","item":"Cimento","quantidade":5,"valor":34.5,"parte":"Arrimo"},{"data":"2025-10-10","item":"Mão de obra","quantidade":7,"valor":150.0,"parte":"Pedreiro"},{"data":"2025-10-10","item":"Mão de obra","quantidade":5,"valor":50.0,"parte":"Pedreiro"},{"data":"2025-10-09","item":"Cimento","quantidade":3,"valor":34.5,"parte":"Arrimo"},{"data":"2025-10-07","item":"Brita 1","quantidade":1,"valor":220.0,"parte":"Arrimo"},{"data":"2025-10-07","item":"Areia","quantidade":2,"valor":160.0,"parte":"Arrimo"},{"data":"2025-10-03","item":"Mão de obra","quantidade":2,"valor":50.0,"parte":"Pedreiro"},{"data":"2025-10-03","item":"Cimento","quantidade":10,"valor":32.0,"parte":"Arrimo"},{"data":"2025-10-01","item":"Tela (Doada pelo De)","quantidade":1,"valor":50.0,"parte":"Outros"},{"data":"2025-09-26","item":"Mão de obra","quantidade":3,"valor":200.0,"parte":"Pedreiro"},{"data":"2025-09-25","item":"Brita 1","quantidade":1,"valor":220.0,"parte":"Arrimo"},{"data":"2025-09-23","item":"Areia","quantidade":1,"valor":160.0,"parte":"Arrimo"},{"data":"2025-09-15","item":"Bitorneira","quantidade":1,"valor":300.0,"parte":"Arrimo"},{"data":"2025-09-12","item":"Mão de obra","quantidade":5,"valor":200.0,"parte":"Pedreiro"},{"data":"2025-09-09","item":"Brita 1","quantidade":1,"valor":230.0,"parte":"Arrimo"},{"data":"2025-09-09","item":"Areia","quantidade":1,"valor":165.0,"parte":"Arrimo"},{"data":"2025-09-09","item":"Abraçadeira","quantidade":20,"valor":0.4,"parte":"Outros"},{"data":"2025-09-05","item":"Mão de obra","quantidade":4,"valor":200.0,"parte":"Pedreiro"},{"data":"2025-09-02","item":"Cimento","quantidade":20,"valor":31.0,"parte":"Arrimo"},{"data":"2025-09-02","item":"Bloco 20","quantidade":375,"valor":3.5,"parte":"Arrimo"},{"data":"2025-09-02","item":"Tela","quantidade":10,"valor":35.18,"parte":"Outros"},{"data":"2025-08-29","item":"Mão de obra","quantidade":3,"valor":200.0,"parte":"Pedreiro"},{"data":"2025-08-22","item":"Mão de obra","quantidade":5,"valor":185.0,"parte":"Pedreiro"},{"data":"2025-08-15","item":"Mão de obra","quantidade":5,"valor":200.0,"parte":"Pedreiro"},{"data":"2025-08-14","item":"Bitorneira","quantidade":1,"valor":300.0,"parte":"Arrimo"},{"data":"2025-08-08","item":"Mão de obra","quantidade":3,"valor":150.0,"parte":"Pedreiro"},{"data":"2025-08-08","item":"Brita 1","quantidade":3,"valor":220.0,"parte":"Arrimo"},{"data":"2025-08-08","item":"Areia","quantidade":3,"valor":160.0,"parte":"Arrimo"},{"data":"2025-08-08","item":"Pedra de mão","quantidade":3,"valor":260.0,"parte":"Arrimo"},{"data":"2025-08-08","item":"Cimento","quantidade":30,"valor":32.0,"parte":"Arrimo"},{"data":"2025-02-24","item":"Retirada de Entulho","quantidade":1,"valor":2400.0,"parte":"Outros"},{"data":"2024-07-26","item":"Demolição| Muro Lateral","quantidade":1,"valor":7307.2,"parte":"Muro"},{"data":"2023-12-22","item":"Projeto (Não feito pelo arquiteto)","quantidade":1,"valor":800.0,"parte":"Outros"},{"data":"2023-11-26","item":"Trena","quantidade":1,"valor":37.63,"parte":"Outros"}];

// ── estado ───────────────────────────────────────────────────
let despesas  = [];
let editIndex = -1;
let chart;

const form             = document.getElementById('form-despesa');
const lista            = document.getElementById('lista-despesas');
const totalDiv         = document.getElementById('total');
const filtro           = document.getElementById('filtro');
const filtroDataInicio = document.getElementById('filtroDataInicio');
const filtroDataFim    = document.getElementById('filtroDataFim');
const btnAdicionar     = document.getElementById('btn-adicionar');
const loadingEl        = document.getElementById('loading');
const ctx              = document.getElementById('graficoDespesas').getContext('2d');

// ── API via GET ──────────────────────────────────────────────
function mostrarLoading(v) { loadingEl.style.display = v ? 'flex' : 'none'; }

async function apiGet(params) {
  const qs  = new URLSearchParams(params).toString();
  const res = await fetch(SCRIPT_URL + (qs ? '?' + qs : ''));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.status !== 'ok') throw new Error(json.msg || 'Erro desconhecido');
  return json;
}

async function carregarDespesas() {
  mostrarLoading(true);
  try {
    const json = await apiGet({ action: 'getAll' });
    despesas   = json.data;
    atualizarTabela();
  } catch (e) {
    alert('Erro ao carregar dados: ' + e.message);
  } finally {
    mostrarLoading(false);
  }
}

// ── formulário ───────────────────────────────────────────────
form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const d = {
    data:       document.getElementById('data').value,
    item:       document.getElementById('item').value,
    quantidade: document.getElementById('quantidade').value,
    valor:      document.getElementById('valor').value,
    parte:      document.getElementById('parte').value
  };

  mostrarLoading(true);
  try {
    if (editIndex === -1) {
      await apiGet({ action: 'add', ...d });
    } else {
      await apiGet({ action: 'edit', index: editIndex, ...d });
      editIndex = -1;
      btnAdicionar.textContent = 'Adicionar';
    }
    form.reset();
    await carregarDespesas();
  } catch (err) {
    alert('Erro ao salvar: ' + err.message);
    mostrarLoading(false);
  }
});

// ── tabela ───────────────────────────────────────────────────
function formatarData(iso) {
  if (!iso) return '';
  const [a, m, d] = iso.split('-');
  return `${d}-${m}-${a}`;
}

function getDespesasFiltradas() {
  const fp    = filtro.value;
  const inicio = filtroDataInicio.value ? new Date(filtroDataInicio.value) : null;
  const fim    = filtroDataFim.value    ? new Date(filtroDataFim.value)    : null;
  return despesas.filter(d => {
    const dt = new Date(d.data);
    if (inicio && dt < inicio) return false;
    if (fim    && dt > fim)    return false;
    return fp === 'Todas' || d.parte === fp;
  });
}

function atualizarTabela() {
  lista.innerHTML = '';
  let total       = 0;
  const filtradas = getDespesasFiltradas()
    .slice()
    .sort((a, b) => new Date(b.data) - new Date(a.data));

  filtradas.forEach(d => {
    const subtotal = d.quantidade * d.valor;
    total += subtotal;
    const idx = despesas.indexOf(d);
    const tr  = document.createElement('tr');
    tr.innerHTML = `
      <td>${formatarData(d.data)}</td>
      <td>${d.item}</td>
      <td>${d.quantidade}</td>
      <td>R$ ${d.valor.toFixed(2)}</td>
      <td>${d.parte}</td>
      <td>R$ ${subtotal.toFixed(2)}</td>
      <td>
        <button class="btn btn-edit"   onclick="editarDespesa(${idx})">Editar</button>
        <button class="btn btn-delete" onclick="excluirDespesa(${idx})">Excluir</button>
      </td>`;
    lista.appendChild(tr);
  });

  totalDiv.textContent = 'Total Gasto: R$ ' + total.toFixed(2);
  atualizarGrafico();
}

// ── editar / excluir ─────────────────────────────────────────
window.editarDespesa = function(index) {
  const d = despesas[index];
  document.getElementById('data').value       = d.data;
  document.getElementById('item').value       = d.item;
  document.getElementById('quantidade').value = d.quantidade;
  document.getElementById('valor').value      = d.valor;
  document.getElementById('parte').value      = d.parte;
  editIndex = index;
  btnAdicionar.textContent = 'Salvar Alterações';
};

window.excluirDespesa = async function(index) {
  if (!confirm('Deseja realmente excluir esta despesa?')) return;
  mostrarLoading(true);
  try {
    await apiGet({ action: 'delete', index });
    await carregarDespesas();
  } catch (err) {
    alert('Erro ao excluir: ' + err.message);
    mostrarLoading(false);
  }
};

// ── migração ─────────────────────────────────────────────────
window.migrarDadosIniciais = async function() {
  if (!confirm(
    `Vai importar ${DADOS_MIGRACAO.length} registros históricos para o Google Sheets.\n` +
    `⚠️ Dados existentes na planilha serão substituídos!\n\nContinuar?`
  )) return;
  mostrarLoading(true);
  try {
    await apiGet({ action: 'importar', rows: JSON.stringify(DADOS_MIGRACAO) });
    await carregarDespesas();
    document.getElementById('btn-migrar').style.display = 'none';
    alert('✅ Migração concluída! 45 registros importados.');
  } catch (err) {
    alert('Erro na migração: ' + err.message);
    mostrarLoading(false);
  }
};

// ── gráfico ──────────────────────────────────────────────────
function atualizarGrafico() {
  const agrupadas = {};
  getDespesasFiltradas().forEach(d => {
    agrupadas[d.parte] = (agrupadas[d.parte] || 0) + d.quantidade * d.valor;
  });
  const ordenadas = Object.entries(agrupadas).sort((a, b) => b[1] - a[1]);
  const labels    = ordenadas.map(e => e[0]);
  const data      = ordenadas.map(e => e[1]);
  const colors    = labels.map((_, i) => `hsl(${i * 360 / labels.length}, 70%, 50%)`);

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'pie',
    data: { labels, datasets: [{ data, backgroundColor: colors }] },
    options: {
      plugins: {
        legend: { position: 'bottom' },
        tooltip: {
          callbacks: {
            label: c => {
              const tot = c.dataset.data.reduce((a, b) => a + b, 0);
              return `${c.label}: R$ ${c.raw.toFixed(2)} (${((c.raw / tot) * 100).toFixed(2)}%)`;
            }
          }
        }
      }
    }
  });
}

// ── exportar Excel ───────────────────────────────────────────
window.exportarExcel = function() {
  const filtradas = getDespesasFiltradas().slice().sort((a, b) => new Date(b.data) - new Date(a.data));
  if (!filtradas.length) return alert('Nenhuma despesa encontrada.');
  const ws = XLSX.utils.json_to_sheet(filtradas.map(d => ({
    Data: formatarData(d.data), Item: d.item, Quantidade: d.quantidade,
    'Valor Unitário': d.valor.toFixed(2), Parte: d.parte,
    Total: (d.quantidade * d.valor).toFixed(2)
  })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Despesas');
  XLSX.writeFile(wb, 'despesas.xlsx');
};

// ── exportar PDF ─────────────────────────────────────────────
window.exportarPDF = function() {
  const filtradas = getDespesasFiltradas().slice().sort((a, b) => new Date(b.data) - new Date(a.data));
  if (!filtradas.length) return alert('Nenhuma despesa encontrada.');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text('Relatório de Despesas de Obras', 14, 15);
  doc.autoTable({
    head: [['Data', 'Item', 'Quantidade', 'Valor Unitário', 'Parte', 'Total']],
    body: filtradas.map(d => [
      formatarData(d.data), d.item, d.quantidade,
      'R$ ' + d.valor.toFixed(2), d.parte,
      'R$ ' + (d.quantidade * d.valor).toFixed(2)
    ]),
    startY: 20
  });
  doc.text(totalDiv.textContent, 14, doc.lastAutoTable.finalY + 10);
  doc.save('despesas.pdf');
};

// ── iniciar ──────────────────────────────────────────────────
carregarDespesas();
</script>
</body>
</html>
